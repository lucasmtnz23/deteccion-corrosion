modelo:
  nombre: faster_rcnn
  num_clases: 4
  preentrenado: true
  capas_entrenables_backbone: 0
  tamano_min: 800
  tamano_max: 1333
datos:
  batch_size: 2
  num_workers: 0
  volteo_horizontal: 0.5
entrenamiento:
  semilla: 42
  epocas: 12
  optimizador: adamw
  scheduler: cosine
  lr: 0.00015
  factor_lr_backbone: 0.1
  descongelar_en_epoca: 3
  capas_tras_descongelar: 3
  weight_decay: 0.0001
  warmup_epocas: 1
  pasos_acumulacion: 4
  clip_grad_norm: 10.0
  usar_amp: true
  metrica_seleccion: map
  dir_salida: results/slippage_validation_split/exp02_transfer_learning
