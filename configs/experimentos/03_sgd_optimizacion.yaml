# Estrategia 3a: Comparativa de optimizador y scheduler (SGD + MultiStepLR)
# Hipótesis: evaluar SGD con momentum (clásico en detectores two-stage) y
# decaimiento escalonado frente a AdamW + cosine del baseline para comprobar
# si generaliza mejor en un dataset reducido (820 imágenes de entrenamiento).

modelo:
  nombre: faster_rcnn
  num_clases: 4
  preentrenado: true
  capas_entrenables_backbone: 3
  tamano_min: 800
  tamano_max: 1333

datos:
  batch_size: 2
  num_workers: 0
  volteo_horizontal: 0.5

entrenamiento:
  semilla: 42
  epocas: 8
  optimizador: sgd
  scheduler: multistep
  milestones: [5, 7]
  gamma: 0.1
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epocas: 1
  pasos_acumulacion: 4
  clip_grad_norm: 10.0
  usar_amp: true
  metrica_seleccion: map
  dir_salida: results/slippage_validation_split/exp03_sgd_multistep
